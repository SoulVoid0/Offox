// Offox developer mode (first line must be a comment). Loaded by autoconfig
// into a stock Firefox ESR 140+ so Offox can be tried without compiling.
// dev/run-dev.sh and dev/run-dev.ps1 install this next to the firefox binary.
try {
  const Services =
    globalThis.Services ||
    ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;
  const Ci = Components.interfaces;
  const Cc = Components.classes;
  let dir = Services.dirsvc.get("GreD", Ci.nsIFile);
  dir.append("offox");
  let res = Services.io
    .getProtocolHandler("resource")
    .QueryInterface(Ci.nsIResProtocolHandler);
  res.setSubstitution("offox", Services.io.newFileURI(dir));
  let manifest = dir.clone();
  manifest.append("chrome.manifest");
  let aomStartup = Cc["@mozilla.org/addons/addon-manager-startup;1"].getService(
    Ci.amIAddonManagerStartup
  );
  // Keep the handle alive for the whole session.
  globalThis.offoxChromeHandle = aomStartup.registerChrome(
    Services.io.newFileURI(manifest),
    [["content", "offox", "content/"]]
  );
  ChromeUtils.importESModule(
    "resource://offox/modules/OffoxService.sys.mjs"
  ).OffoxService.initDevMode();
} catch (e) {
  Components.utils.reportError("Offox developer mode failed to start: " + e);
}
