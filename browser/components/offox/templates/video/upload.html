<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload – {{SITE_TITLE}}</title>
  <meta name="fireline" content="noindex">
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="assets/ui.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main id="main">
    <div class="page">
      <h1>Upload videos</h1>
      <label class="dropzone" id="drop">
        <b>Drag and drop video files here</b>
        or click to choose files. Any format works: MP4, WebM, MKV, MOV, AVI, WMV, FLV, MPEG…
        <span class="hint">Subtitle files (.vtt, .srt) and yt-dlp's .info.json (title, description, comments) with the same name as a video are added to it.</span>
        <input type="file" id="files" accept="video/*,.mkv,.avi,.wmv,.flv,.ts,.m2ts,.mts,.mpg,.mpeg,.vob,.3gp,.ogv,.vtt,.srt,.json,.description,.jpg,.jpeg,.png,.webp" multiple hidden>
      </label>
      <div class="auto-subs" id="auto-subs" hidden>
        <label><input type="checkbox" id="auto-subs-on"> Make automatic subtitles from the speech</label>
        <label>Spoken language <span id="auto-subs-lang"></span></label>
        <label><input type="checkbox" id="auto-subs-translate"> Translate to English</label>
        <div class="meta" id="auto-subs-note"></div>
      </div>
      <div id="items"></div>
      <div class="toolbar" id="actions" hidden>
        <button class="btn primary" id="upload-all">Upload all</button>
        <span class="meta" id="summary"></span>
      </div>
    </div>
  </main>
  <script src="/__offox/offox.js"></script>
  <script src="assets/util.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/comments.js"></script>
  <script src="assets/subtitles.js"></script>
  <script>
    (async () => {
      await OffTube.layout("upload");
      let media = await Offox.media.info().catch(() => ({ ffmpeg: false }));
      let pending = [];
      let speech = await OffTubeSubs.speechInfo();

      // ---------- Automatic subtitles for new uploads
      let langSelect = OffTubeSubs.languageSelect(localStorageGet("offtube.uploadLang") || "auto");
      $("#auto-subs-lang").append(langSelect);
      $("#auto-subs").hidden = false;
      $("#auto-subs-on").checked = speech.available && localStorageGet("offtube.autoSubs") !== "off";
      $("#auto-subs-on").disabled = !speech.available;
      $("#auto-subs-note").textContent = speech.available
        ? `Made on this computer after each upload, without the internet (speech model: ${speech.modelName}). You can keep using Offox meanwhile.`
        : "Speech recognition (whisper.cpp and a speech model) is not set up: it comes with the Offox installers, or choose it in about:offox → Automatic subtitles.";
      $("#auto-subs-on").addEventListener("change", e => localStorageSet("offtube.autoSubs", e.target.checked ? "on" : "off"));
      langSelect.addEventListener("change", () => localStorageSet("offtube.uploadLang", langSelect.value));
      function localStorageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      let subtitleQueue = Promise.resolve();

      // ---------- Companion files (video.en.vtt, video.info.json, ...)
      let stemOf = name => name.replace(/\.[^.]+$/, "");
      let isVideo = f => VIDEO_EXT.includes(extOf(f.name)) || (f.type.startsWith("video/") && !/\.(vtt|srt)$/i.test(f.name));
      let orphans = [];
      function attachCompanions(files) {
        let videos = pending.filter(p => !p.done);
        for (let f of files) {
          let target = videos
            .filter(p => f.name.startsWith(stemOf(p.file.name) + "."))
            .sort((a, b) => b.file.name.length - a.file.name.length)[0];
          if (!target && videos.length === 1) target = videos[0];
          if (!target) { orphans.push(f); continue; }
          target.companions.push(f);
          applyCompanion(target, f);
        }
        orphans = orphans.filter(f => !pending.some(p => p.companions.includes(f)));
      }
      async function applyCompanion(item, f) {
        let name = f.name.toLowerCase();
        if (name.endsWith(".info.json")) {
          try {
            let info = JSON.parse(await f.text());
            item.ytInfo = info;
            if (info.title) item.title.value = info.title;
            if (typeof info.description === "string") item.description.value = info.description;
          } catch (e) {
            item.status.append(h("div", { class: "warn" }, `${f.name} could not be read: ${e.message}`));
          }
        } else if (name.endsWith(".description")) {
          item.description.value = await f.text();
        } else if (/\.(jpe?g|png|webp)$/.test(name)) {
          item.thumbFile = f;
          item.thumb.replaceChildren(h("img", { src: URL.createObjectURL(f), alt: "" }));
        }
        item.extras.replaceChildren(...item.companions.map(c => h("span", { class: "extra" }, c.name.slice(stemOf(item.file.name).length + 1) || c.name)));
      }

      function addFile(file) {
        let item = { file, done: false, companions: [] };
        let thumb = h("div", { class: "thumb" }, h("span", { class: "placeholder" }, "⏳"));
        let title = h("input", { type: "text", value: file.name.replace(/\.[^.]+$/, "").replace(/[_]+/g, " "), maxlength: 200 });
        let description = h("textarea", { rows: 4, placeholder: "Tell viewers about your video" });
        let bar = h("progress", { max: 1, value: 0, hidden: true });
        let status = h("div", { class: "status" }, `${file.name} · ${formatSize(file.size)}`);
        let remove = h("button", { class: "btn", onclick: () => { pending = pending.filter(p => p !== item); row.remove(); refresh(); } }, "Remove");
        let row = h("div", { class: "upload-item" },
          thumb,
          h("div", {},
            h("label", {}, "Title", title),
            h("label", {}, "Description", description),
            h("div", { class: "extras" }),
            status, bar,
            h("div", { class: "toolbar" }, remove)));
        Object.assign(item, { row, thumb, title, description, bar, status, remove, extras: row.querySelector(".extras") });
        pending.push(item);
        $("#items").append(row);
        refresh();

        // Preview + playability check happen locally before anything is copied.
        let url = URL.createObjectURL(file);
        captureThumbnail(url).then(result => {
          URL.revokeObjectURL(url);
          item.playable = !!result;
          if (result) {
            item.duration = result.duration;
            item.thumbBlob = result.blob;
            if (item.thumbFile) return;
            thumb.replaceChildren(h("img", { src: URL.createObjectURL(result.blob), alt: "" }),
              h("span", { class: "duration" }, formatDuration(result.duration)));
          } else {
            if (!item.thumbFile) thumb.replaceChildren(h("span", { class: "placeholder" }, extOf(file.name).toUpperCase() || "?"));
            status.append(h("div", { class: "warn" }, media.ffmpeg
              ? "Firefox can't play this format directly; Offox will convert a copy after uploading (the original is kept)."
              : "Firefox can't play this format directly. It will be stored as-is; install FFmpeg to convert it later."));
          }
        });
      }

      function refresh() {
        $("#actions").hidden = !pending.some(p => !p.done);
        $("#summary").textContent = `${pending.filter(p => !p.done).length} file(s) ready`;
      }

      async function uploadOne(item) {
        let id = Offox.id();
        let ext = extOf(item.file.name) || "mp4";
        let dir = `videos/${id}`;
        item.remove.disabled = true;
        item.bar.hidden = false;
        await Offox.mkdir(dir);
        item.status.textContent = "Copying into your storage folder…";
        await Offox.upload(`${dir}/video.${ext}`, item.file, {
          onProgress: p => { item.bar.value = p; item.status.textContent = `Copying… ${Math.round(p * 100)}%`; },
        });
        await Offox.writeText(`${dir}/title.txt`, item.title.value.trim() || item.file.name);
        await Offox.writeText(`${dir}/description.txt`, item.description.value);
        let yt = item.ytInfo || null;
        let created = new Date().toISOString();
        if (yt && /^\d{8}$/.test(yt.upload_date || "")) {
          let d = yt.upload_date;
          created = new Date(`${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}T12:00:00Z`).toISOString();
        } else if (yt && yt.timestamp) {
          created = new Date(yt.timestamp * 1000).toISOString();
        }
        await Offox.writeText(`${dir}/created.txt`, created);
        let info = { file: `video.${ext}`, originalName: item.file.name, duration: item.duration || yt?.duration || 0, views: 0 };
        if (yt) {
          info.source = {
            id: yt.id, url: yt.webpage_url, channel: yt.channel || yt.uploader, channelUrl: yt.channel_url || yt.uploader_url,
            views: yt.view_count, likes: yt.like_count, comments: yt.comment_count,
          };
        }
        if (item.thumbFile) item.thumbBlob = await toJpeg(item.thumbFile).catch(() => item.thumbBlob);
        if (item.thumbBlob) await Offox.write(`${dir}/thumbnail.jpg`, item.thumbBlob);
        await Offox.writeJSON(`${dir}/info.json`, info);

        // Comments and subtitles that came with the video.
        if (yt && Array.isArray(yt.comments) && yt.comments.length) {
          let n = await OffTubeComments.importInto(id, yt.comments);
          item.status.append(h("div", {}, `Imported ${plural(n, "comment")}.`));
        }
        let autoLangs = new Set(Object.keys(yt?.automatic_captions || {}));
        let ownLangs = new Set(Object.keys(yt?.subtitles || {}));
        let hasSubs = false;
        for (let f of item.companions.filter(c => /\.(vtt|srt)$/i.test(c.name))) {
          try {
            let lang = OffTubeSubs.guessLang(f.name) || "und";
            let base = lang.replace(/-orig$/, "");
            let auto = autoLangs.has(lang) && !ownLangs.has(lang);
            let vtt = OffTubeSubs.toVtt(await f.text(), f.name);
            await Offox.writeText(`${OffTubeSubs.dir(id)}/${base}${auto ? ".auto" : ""}.vtt`, vtt);
            hasSubs = true;
          } catch (e) {
            item.status.append(h("div", { class: "warn" }, `${f.name}: ${e.message}`));
          }
        }

        if (item.playable === false && media.ffmpeg) {
          item.bar.value = 0;
          try {
            let job = await Offox.media.convertAndWait(`${dir}/video.${ext}`, {
              onProgress: p => { item.bar.value = p; item.status.textContent = `Converting so it plays in Offox… ${Math.round(p * 100)}%`; },
            });
            info.converted = job.outputName;
            await Offox.writeJSON(`${dir}/info.json`, info);
          } catch (e) {
            item.status.append(h("div", { class: "warn" }, "Conversion failed: " + e.message));
          }
        }
        item.done = true;
        item.bar.value = 1;
        item.status.replaceChildren("Uploaded · ", h("a", { href: `watch.html?v=${id}`, style: { color: "var(--link)" } }, "Watch it now"));
        refresh();

        // Subtitle tracks stored inside the file (MKV, MP4).
        if (media.ffmpeg && !hasSubs) {
          let video = { id, original: `video.${ext}`, file: info.converted || `video.${ext}` };
          try {
            let files = await OffTubeSubs.extractEmbedded(video);
            if (files.length) {
              hasSubs = true;
              item.status.append(h("div", {}, `Added ${plural(files.length, "subtitle track")} from the video file.`));
            }
          } catch (e) {}
        }
        if ($("#auto-subs-on").checked && !hasSubs) {
          let line = h("div", { class: "meta" }, "Automatic subtitles: waiting…");
          item.status.append(line);
          let video = { id, original: `video.${ext}`, file: info.converted || `video.${ext}` };
          let language = langSelect.value;
          let translate = $("#auto-subs-translate").checked;
          subtitleQueue = subtitleQueue.then(async () => {
            try {
              let job = await OffTubeSubs.generate(video, {
                language, translate,
                onProgress: (p, text) => { line.textContent = "Automatic subtitles: " + text; },
              });
              line.textContent = `Automatic subtitles ready (${OffTubeSubs.parseName(job.outputName)?.label || job.language}).`;
            } catch (e) {
              line.className = "warn";
              line.textContent = "Automatic subtitles failed: " + e.message;
            }
          });
        }
      }

      async function toJpeg(file) {
        let bitmap = await createImageBitmap(file);
        let c = document.createElement("canvas");
        let scale = Math.min(1, 1280 / bitmap.width);
        c.width = Math.round(bitmap.width * scale);
        c.height = Math.round(bitmap.height * scale);
        c.getContext("2d").drawImage(bitmap, 0, 0, c.width, c.height);
        return new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
      }
      function addFiles(files) {
        let videos = files.filter(isVideo);
        videos.forEach(addFile);
        attachCompanions([...files.filter(f => !isVideo(f)), ...orphans]);
      }

      $("#files").addEventListener("change", e => { addFiles([...e.target.files]); e.target.value = ""; });
      let drop = $("#drop");
      drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
      drop.addEventListener("dragleave", () => drop.classList.remove("over"));
      drop.addEventListener("drop", e => {
        e.preventDefault();
        drop.classList.remove("over");
        addFiles([...e.dataTransfer.files]);
      });
      $("#upload-all").addEventListener("click", async e => {
        e.target.disabled = true;
        for (let item of pending.filter(p => !p.done)) {
          try { await uploadOne(item); }
          catch (err) { item.status.append(h("div", { class: "warn" }, "Upload failed: " + err.message)); }
        }
        e.target.disabled = false;
        toast("All uploads finished");
      });
    })();
  </script>
</body>
</html>
