<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SITE_TITLE}}</title>
  <meta name="description" content="{{SITE_DESCRIPTION}}">
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="assets/ui.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main id="main">
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </main>
  <script src="/__offox/offox.js"></script>
  <script src="assets/util.js"></script>
  <script src="assets/app.js"></script>
  <script>
    (async () => {
      await OffTube.layout("home");
      let all = await OffTube.videos();
      let q = (param("search") || "").toLowerCase().trim();
      let sorts = {
        "Newest": (a, b) => new Date(b.created) - new Date(a.created),
        "Oldest": (a, b) => new Date(a.created) - new Date(b.created),
        "Most viewed": (a, b) => b.views - a.views,
        "A–Z": (a, b) => a.title.localeCompare(b.title),
      };
      let current = localStorage.getItem("offtube-sort") || "Newest";
      let grid = $("#grid");
      let render = () => {
        grid.textContent = "";
        let list = all.filter(v => !q || (v.title + " " + v.description).toLowerCase().includes(q)).sort(sorts[current]);
        for (let v of list) grid.append(OffTube.card(v));
        if (!list.length) {
          grid.replaceChildren(h("div", { class: "empty", style: { gridColumn: "1/-1" } },
            q ? h("h2", {}, `No videos match “${q}”`) : h("h2", {}, "No videos yet"),
            h("p", {}, q ? "Try another search." : "Upload your first video, or copy video folders into the site's videos/ folder."),
            h("a", { class: "btn primary", href: "upload.html" }, "Upload a video")));
        }
        $$("#chips .chip").forEach(c => c.classList.toggle("active", c.textContent === current));
      };
      for (let name of Object.keys(sorts)) {
        $("#chips").append(h("button", { class: "chip", onclick: () => { current = name; localStorage.setItem("offtube-sort", name); render(); } }, name));
      }
      if (q) $("#chips").prepend(h("a", { class: "chip", href: "./" }, `✕ ${q}`));
      render();
    })();
  </script>
</body>
</html>
