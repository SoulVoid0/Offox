<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SITE_TITLE}}</title>
  <meta name="fireline" content="noindex">
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="assets/ui.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="sidebar-collapsed">
  <main id="main">
    <div class="watch">
      <div class="primary">
        <div class="player" id="player"></div>
        <h1 id="title"></h1>
        <div class="row">
          <div class="meta" id="meta"></div>
          <div class="buttons" id="buttons"></div>
        </div>
        <div class="description collapsed" id="description"></div>
        <section class="comments" id="comments" aria-label="Comments"></section>
      </div>
      <div class="secondary" id="secondary"></div>
    </div>
  </main>
  <script src="/__offox/offox.js"></script>
  <script src="assets/util.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/comments.js"></script>
  <script src="assets/subtitles.js"></script>
  <script>
    (async () => {
      await OffTube.layout("watch");
      let id = param("v");
      let listId = param("list");
      let all = await OffTube.videos();
      let video = all.find(v => v.id === id);
      if (!video) {
        $("#main").replaceChildren(h("div", { class: "empty" }, h("h2", {}, "This video isn't available"), h("p", {}, "It may have been deleted or moved."), h("a", { class: "btn", href: "./" }, "Go home")));
        return;
      }
      document.title = `${video.title} – {{SITE_TITLE}}`;

      // ---------- Player
      let player = $("#player");
      let el = h("video", { controls: true, autoplay: true, playsinline: true, preload: "metadata" });
      el.src = OffTube.videoUrl(video);
      if (video.hasThumb) el.poster = OffTube.thumbUrl(video);
      player.append(el);
      let seek = sec => { el.currentTime = sec; el.play().catch(() => {}); scrollTo({ top: 0, behavior: "smooth" }); };

      // ---------- Subtitles (CC)
      let tracks = [];
      let speech = null;
      let ccButton = h("button", { class: "btn", title: "Subtitles", onclick: () => subtitlesDialog() }, "CC Subtitles");
      let transcriptButton = h("button", { class: "btn", hidden: true, onclick: () => toggleTranscript() }, "☰ Transcript");
      let applyingTracks = false;

      let tracksLoading = Promise.resolve();
      function loadTracks(select) {
        tracksLoading = tracksLoading.catch(() => {}).then(() => reloadTracks(select));
        return tracksLoading;
      }
      async function reloadTracks(select) {
        tracks = await OffTubeSubs.list(video.id);
        applyingTracks = true;
        for (let t of [...el.querySelectorAll("track")]) t.remove();
        let want = select || OffTubeSubs.preferred();
        // Show the preferred language, else the first track you added yourself.
        let chosen = want === "off" ? null
          : tracks.find(t => t.name === want) || tracks.find(t => t.lang === want && !t.auto) || tracks.find(t => t.lang === want) || null;
        for (let t of tracks) {
          let node = h("track", { kind: "subtitles", label: t.label, srclang: t.lang === "und" ? "" : t.lang, src: t.url });
          el.append(node);
          t.track = node.track;
        }
        // Browsers may pick a track by themselves after <track>s are added;
        // apply the choice again once they have settled.
        let apply = () => { for (let t of tracks) t.track.mode = chosen && t.name === chosen.name ? "showing" : "disabled"; };
        apply();
        await new Promise(r => setTimeout(r, 50));
        apply();
        ccButton.classList.toggle("on", !!chosen);
        ccButton.textContent = tracks.length ? `CC ${chosen ? chosen.lang.toUpperCase() : "Off"}` : "CC Subtitles";
        transcriptButton.hidden = !tracks.length;
        setTimeout(() => { applyingTracks = false; }, 50);
        if (transcriptPanel.isConnected) showTranscript();
      }

      // Remember the language picked in the player's own CC menu.
      el.textTracks.addEventListener("change", () => {
        if (applyingTracks) return;
        let t = tracks.find(x => x.track && x.track.mode === "showing");
        OffTubeSubs.setPreferred(t ? t.lang : "off");
        ccButton.classList.toggle("on", !!t);
        if (tracks.length) ccButton.textContent = `CC ${t ? t.lang.toUpperCase() : "Off"}`;
        if (transcriptPanel.isConnected) showTranscript();
      });

      let transcriptPanel = h("div", { class: "panel transcript" });
      async function showTranscript() {
        let t = tracks.find(x => x.track && x.track.mode === "showing") || tracks[0];
        if (!t) { transcriptPanel.remove(); return; }
        let cues = OffTubeSubs.parseVtt(await (await fetch(t.url, { cache: "no-store" })).text());
        let pick = h("select", { "aria-label": "Transcript language", onchange: e => {
          OffTubeSubs.setPreferred(e.target.value);
          loadTracks(e.target.value);
        } }, tracks.map(x => h("option", { value: x.name, selected: x === t }, x.label)));
        let rows = cues.map(c => h("button", { class: "cue", "data-start": c.start, onclick: () => seek(c.start) },
          h("span", { class: "time" }, cueTime(c.start)), h("span", {}, c.text)));
        transcriptPanel.replaceChildren(
          h("div", { class: "transcript-head" }, h("h2", {}, "Transcript"),
            h("button", { class: "icon-btn", title: "Close", onclick: () => transcriptPanel.remove() }, "✕")),
          pick,
          h("div", { class: "cues" }, rows.length ? rows : h("p", { class: "meta" }, "This subtitle file is empty.")));
        if (!transcriptPanel.isConnected) $("#secondary").prepend(transcriptPanel);
      }
      function cueTime(sec) {
        sec = Math.floor(sec);
        let hh = Math.floor(sec / 3600), mm = Math.floor(sec / 60) % 60, ss = String(sec % 60).padStart(2, "0");
        return hh ? `${hh}:${String(mm).padStart(2, "0")}:${ss}` : `${mm}:${ss}`;
      }
      function toggleTranscript() {
        if (transcriptPanel.isConnected) transcriptPanel.remove();
        else showTranscript();
      }
      el.addEventListener("timeupdate", () => {
        if (!transcriptPanel.isConnected) return;
        let now = el.currentTime;
        let current = null;
        for (let b of transcriptPanel.querySelectorAll(".cue")) {
          let on = Number(b.dataset.start) <= now;
          if (on) current = b;
          b.classList.remove("current");
        }
        if (current) {
          current.classList.add("current");
          let box = transcriptPanel.querySelector(".cues");
          if (current.offsetTop < box.scrollTop || current.offsetTop > box.scrollTop + box.clientHeight - 40) {
            box.scrollTop = current.offsetTop - box.clientHeight / 3;
          }
        }
      });

      let subsStatus = h("div", { class: "subs-progress", hidden: true }, h("progress", { max: 1, value: 0 }), h("span", {}));
      let setSubsProgress = (p, text) => {
        subsStatus.hidden = false;
        subsStatus.firstChild.value = p;
        subsStatus.lastChild.textContent = text;
      };

      async function generateSubs(language, translate) {
        setSubsProgress(0, "Starting…");
        try {
          let job = await OffTubeSubs.generate(video, { language, translate, onProgress: setSubsProgress });
          subsStatus.hidden = true;
          OffTubeSubs.setPreferred(job.language);
          await loadTracks(job.outputName);
          toast(`Automatic subtitles ready: ${OffTubeSubs.parseName(job.outputName)?.label || job.outputName}`);
        } catch (e) {
          setSubsProgress(0, "Automatic subtitles failed: " + e.message);
        }
      }

      async function subtitlesDialog() {
        speech = speech || await OffTubeSubs.speechInfo();
        let list = h("div", { class: "track-list" });
        let renderList = () => {
          list.replaceChildren(...(tracks.length ? tracks.map((t, i) => h("div", { class: "track-row" },
            h("label", {}, h("input", { type: "radio", name: "cc", checked: t.track?.mode === "showing", onchange: () => { OffTubeSubs.setPreferred(t.name); loadTracks(t.name); } }), t.label),
            h("a", { class: "icon-btn", title: "Download", href: t.url + "?download=" + encodeURIComponent(`${video.title}.${t.name}`) }, "⬇"),
            h("button", { class: "icon-btn", title: "Delete", onclick: async () => {
              if (!confirm(`Delete the ${t.label} subtitles?`)) return;
              await Offox.remove(`${OffTubeSubs.dir(video.id)}/${t.name}`);
              await loadTracks();
              renderList();
            } }, "🗑"))) : [h("p", { class: "meta" }, "This video has no subtitles yet.")]),
          tracks.length ? h("label", { class: "track-row" }, h("input", { type: "radio", name: "cc", checked: !tracks.some(x => x.track?.mode === "showing"), onchange: () => { OffTubeSubs.setPreferred("off"); loadTracks("off"); } }), "Off") : null);
        };
        renderList();

        let lang = OffTubeSubs.languageSelect("auto");
        let translate = h("input", { type: "checkbox", name: "translate" });
        let genButton = h("button", { class: "btn primary", disabled: !speech.available, onclick: () => {
          dlg.close();
          generateSubs(lang.value, translate.checked);
        } }, "Generate");
        let auto = h("section", {},
          h("h3", {}, "Automatic subtitles"),
          speech.available
            ? h("p", { class: "meta" }, `Offox listens to the video and writes subtitles on your computer, without the internet (speech model: ${speech.modelName}). It takes about as long as the video on a slow computer, and much less on a fast one.`)
            : h("p", { class: "warn" }, "Speech recognition is not set up. Offox needs whisper.cpp and a speech model: they come with the Offox installers, or choose them in about:offox → Automatic subtitles."),
          h("div", { class: "row-form" },
            h("label", {}, "Spoken language ", lang),
            h("label", {}, translate, " Translate to English"),
            genButton));

        let fileInput = h("input", { type: "file", accept: ".vtt,.srt,text/vtt", hidden: true });
        let addLang = OffTubeSubs.languageSelect("en");
        addLang.querySelector("option[value=auto]").remove();
        addLang.prepend(h("option", { value: "und" }, "Unknown language"));
        fileInput.addEventListener("change", async () => {
          let file = fileInput.files[0];
          if (!file) return;
          try {
            let guessed = OffTubeSubs.guessLang(file.name);
            let name = await OffTubeSubs.add(video.id, file, guessed || addLang.value);
            await loadTracks(name);
            renderList();
            toast("Subtitles added");
          } catch (e) {
            toast(e.message, 5000);
          }
          fileInput.value = "";
        });
        let upload = h("section", {},
          h("h3", {}, "Add a subtitle file"),
          h("div", { class: "row-form" },
            h("label", {}, "Language ", addLang),
            h("button", { class: "btn", onclick: () => fileInput.click() }, "Choose .vtt or .srt…"), fileInput));

        let embedded = h("section", { hidden: true });
        let media = await Offox.media.info().catch(() => ({ ffmpeg: false }));
        if (media.ffmpeg) {
          Offox.media.subtitleStreams(`videos/${video.id}/${video.original}`).then(streams => {
            let text = streams.filter(s => s.text);
            if (!text.length) return;
            let status = h("span", { class: "meta" });
            embedded.hidden = false;
            embedded.append(h("h3", {}, "Subtitles inside the video file"),
              h("p", { class: "meta" }, `This file contains ${plural(text.length, "subtitle track")}: ${text.map(s => OffTubeSubs.langName(s.language)).join(", ")}.`),
              h("button", { class: "btn", onclick: async e => {
                e.target.disabled = true;
                status.textContent = " Copying…";
                try {
                  let files = await OffTubeSubs.extractEmbedded(video);
                  await loadTracks(files[0]?.name);
                  renderList();
                  status.textContent = ` Added ${plural(files.length, "track")}.`;
                } catch (err) {
                  status.textContent = " Failed: " + err.message;
                  e.target.disabled = false;
                }
              } }, "Add them"), status);
          }).catch(() => {});
        }

        let dlg = h("dialog", { class: "offox-dialog subtitles-dialog" },
          h("div", { class: "offox-dialog-form" },
            h("h2", {}, "Subtitles"),
            list, auto, embedded, upload,
            h("div", { class: "offox-dialog-buttons" }, h("button", { class: "primary", onclick: () => dlg.close() }, "Done"))));
        dlg.addEventListener("close", () => dlg.remove());
        document.body.append(dlg);
        dlg.showModal();
      }

      let notice = (...children) => {
        player.querySelector(".notice")?.remove();
        player.append(h("div", { class: "notice" }, ...children));
      };

      el.addEventListener("error", async () => {
        if (!el.error || el.error.code !== MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED && el.error.code !== MediaError.MEDIA_ERR_DECODE) return;
        let media = await Offox.media.info().catch(() => ({ ffmpeg: false }));
        let ext = extOf(video.file).toUpperCase();
        if (!media.ffmpeg) {
          notice(h("h2", {}, `Offox can't play this ${ext} video yet`),
            h("p", {}, "Install FFmpeg (or pick an ffmpeg program in about:offox → Video formats) and Offox will convert it into a format it can play. The original file is kept."),
            h("a", { class: "btn", href: Offox.url(`videos/${video.id}/${video.original}`) + "?download" }, "Download original"));
          return;
        }
        let bar = h("progress", { max: 1, value: 0 });
        let status = h("p", {}, "");
        let start = h("button", { class: "btn primary", onclick: async () => {
          start.disabled = true;
          try {
            status.textContent = "Converting… you can keep using Offox meanwhile.";
            let job = await Offox.media.convertAndWait(`videos/${video.id}/${video.original}`, {
              onProgress: (p, j) => { bar.value = p; status.textContent = `${j.action === "transcode" ? "Converting" : "Repackaging"}… ${Math.round(p * 100)}%`; },
            });
            await OffTube.updateInfo(video.id, { converted: job.outputName, file: video.original });
            location.reload();
          } catch (e) {
            status.textContent = "Conversion failed: " + e.message;
            start.disabled = false;
          }
        } }, "Convert so it plays");
        notice(h("h2", {}, `This ${ext} video needs converting`),
          h("p", {}, "Firefox can't play this format directly. Offox can convert a copy with FFmpeg; the original file is kept."),
          start, bar, status);
      });

      // Count a view once it has played for a few seconds; make a thumbnail if there is none.
      let counted = false;
      el.addEventListener("timeupdate", async () => {
        if (counted || el.currentTime < 3) return;
        counted = true;
        let changes = { views: (video.views || 0) + 1 };
        if (!video.duration && isFinite(el.duration)) changes.duration = el.duration;
        if (!video.hasThumb && el.videoWidth) {
          let c = document.createElement("canvas");
          let scale = Math.min(1, 640 / el.videoWidth);
          c.width = Math.round(el.videoWidth * scale);
          c.height = Math.round(el.videoHeight * scale);
          c.getContext("2d").drawImage(el, 0, 0, c.width, c.height);
          let blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
          if (blob) await Offox.write(`videos/${video.id}/thumbnail.jpg`, blob);
        }
        await OffTube.updateInfo(video.id, changes);
      });

      // ---------- Details
      $("#title").textContent = video.title;
      $("#meta").textContent = `${plural(video.views + 1, "view")} · ${formatDate(video.created)}`;
      $("#buttons").append(
        ccButton,
        transcriptButton,
        h("button", { class: "btn", onclick: () => OffTube.saveToPlaylist(video.id) }, "≡+ Save"),
        h("a", { class: "btn", href: Offox.url(`videos/${video.id}/${video.original}`) + "?download=" + encodeURIComponent(video.title + "." + extOf(video.original)) }, "⬇ Download"),
        h("button", { class: "btn", onclick: async () => {
          let data = await dialogForm("Edit video", [
            { name: "title", label: "Title", value: video.title, required: true },
            { name: "description", label: "Description", type: "textarea", value: video.description, rows: 8 },
          ]);
          if (!data) return;
          await Offox.writeText(`videos/${video.id}/title.txt`, data.title.trim());
          await Offox.writeText(`videos/${video.id}/description.txt`, data.description);
          location.reload();
        } }, "✎ Edit"),
        h("button", { class: "btn danger", onclick: async () => {
          if (!confirm(`Delete “${video.title}”? The video folder will be removed from your disk.`)) return;
          await Offox.remove(`videos/${video.id}`);
          for (let pl of await OffTube.playlists()) {
            if (pl.videos.includes(video.id)) {
              pl.videos = pl.videos.filter(x => x !== video.id);
              await OffTube.savePlaylist(pl);
            }
          }
          location.href = "./";
        } }, "🗑 Delete"));

      let desc = $("#description");
      let text = h("div", { class: "text" }, linkify(video.description || "No description."));
      desc.append(h("div", { class: "stats" }, `${formatDate(video.created)}${video.converted ? " · converted from " + extOf(video.original).toUpperCase() : ""}`), text);
      if (video.description.split("\n").length > 3 || video.description.length > 240) {
        let more = h("button", { class: "more", onclick: () => {
          desc.classList.toggle("collapsed");
          more.textContent = desc.classList.contains("collapsed") ? "…more" : "Show less";
        } }, "…more");
        desc.append(more);
      }

      $(".watch > .primary").insertBefore(subsStatus, $("#description"));
      loadTracks().then(() => OffTubeSubs.resume(video.id, setSubsProgress)).then(job => {
        if (job) { subsStatus.hidden = true; loadTracks(job.outputName); }
      }).catch(e => setSubsProgress(0, "Automatic subtitles failed: " + e.message));

      // ---------- Comments
      OffTubeComments.mount($("#comments"), { videoId: video.id, seek });
      if (location.hash.startsWith("#t=")) el.currentTime = Number(location.hash.slice(3)) || 0;

      // ---------- Playlist panel / up next
      let secondary = $("#secondary");
      let playlist = null;
      if (listId) {
        try { playlist = await Offox.readJSON(`playlists/${listId}.json`); } catch (e) {}
      }
      if (playlist) {
        let items = playlist.videos.map(pid => all.find(v => v.id === pid)).filter(Boolean);
        let index = items.findIndex(v => v.id === video.id);
        let panel = h("div", { class: "panel" },
          h("h2", {}, h("a", { href: `playlist.html?id=${encodeURIComponent(playlist.id)}` }, playlist.name)),
          h("div", { class: "sub" }, `${index + 1} / ${items.length}`),
          items.map(v => OffTube.compact(v, `watch.html?v=${encodeURIComponent(v.id)}&list=${encodeURIComponent(playlist.id)}`, v.id === video.id)));
        secondary.append(panel);
        panel.querySelector(".current")?.scrollIntoView({ block: "nearest" });
        el.addEventListener("ended", () => {
          let next = items[index + 1];
          if (next) location.href = `watch.html?v=${encodeURIComponent(next.id)}&list=${encodeURIComponent(playlist.id)}`;
        });
      }
      secondary.append(h("h3", {}, "Up next"));
      for (let v of all.filter(v => v.id !== video.id).slice(0, 30)) {
        secondary.append(OffTube.compact(v, `watch.html?v=${encodeURIComponent(v.id)}`));
      }
    })();
  </script>
</body>
</html>
