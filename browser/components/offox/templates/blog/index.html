<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SITE_TITLE}}</title>
  <meta name="description" content="{{SITE_DESCRIPTION}}">
  <link rel="stylesheet" href="assets/ui.css">
  <link rel="stylesheet" href="assets/blog.css">
</head>
<body>
  <main id="main"></main>
  <script src="/__offox/offox.js"></script>
  <script src="assets/util.js"></script>
  <script src="assets/md.js"></script>
  <script src="assets/blog.js"></script>
  <script>
    (async () => {
      Blog.header();
      let tag = param("tag");
      let posts = (await Blog.posts()).filter(p => !tag || p.tags.includes(tag));
      let main = $("#main");
      if (tag) main.append(h("p", { class: "meta" }, `Posts tagged “${tag}” · `, h("a", { href: "./" }, "show all")));
      for (let p of posts) {
        main.append(h("div", { class: "post-item" },
          h("div", { class: "meta" }, formatDate(p.date), p.draft ? " · draft" : ""),
          h("h2", {}, h("a", { href: `post.html?slug=${encodeURIComponent(p.slug)}` }, p.title)),
          h("p", {}, p.summary),
          p.tags.map(t => h("a", { class: "tag", href: `?tag=${encodeURIComponent(t)}` }, t))));
      }
      if (!posts.length) main.append(h("div", { class: "post-item" }, h("h2", {}, "Nothing here yet"), h("p", {}, "Write your first post — it is saved as a Markdown file in the posts folder."), h("a", { class: "btn primary", href: "write.html" }, "✍ Write a post")));
    })();
  </script>
</body>
</html>
