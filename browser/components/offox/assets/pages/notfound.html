<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{HOST}} is not one of your websites</title>
  <style>
    :root { color-scheme: light dark; --accent: #e8590c; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
    .box { max-width: 620px; padding: 24px; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { opacity: .8; }
    form { display: flex; gap: 8px; margin: 22px 0; }
    input { flex: 1; font: inherit; padding: 10px 16px; border-radius: 999px; border: 1px solid #8886; background: transparent; color: inherit; }
    button { font: inherit; padding: 0 20px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; }
    ul { padding-left: 20px; }
    a { color: var(--accent); }
    code { background: #8882; padding: 1px 6px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Offox is offline</h1>
    <p><code>{{HOST}}</code> is not one of your websites. Offox never connects to the internet; every website lives in one of your storage folders.</p>
    <form action="https://fireline.offox/search" method="get">
      <input name="q" value="{{QUERY}}" aria-label="Search">
      <button>Search with FireLine</button>
    </form>
    <ul id="maybe"></ul>
    <p>To make a website at this address, open <code>about:offox</code> (or click <b>Offox Sites</b> in the toolbar) and choose <b>Create a website</b>.</p>
  </div>
  <script>
    fetch("https://fireline.offox/api/search?limit=5&q=" + encodeURIComponent(document.querySelector("input").value))
      .then(r => r.json())
      .then(data => {
        let ul = document.getElementById("maybe");
        if (data.results.length) {
          ul.before(Object.assign(document.createElement("p"), { textContent: "Did you mean:" }));
        }
        for (let r of data.results) {
          let a = Object.assign(document.createElement("a"), { href: r.url, textContent: r.title });
          let li = document.createElement("li");
          li.append(a, " — " + r.url.replace("https://", ""));
          ul.append(li);
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
