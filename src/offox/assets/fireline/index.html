<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FireLine</title>
  <link rel="icon" href="/logo.svg">
  <link rel="search" type="application/opensearchdescription+xml" title="FireLine" href="/opensearch.xml">
  <link rel="stylesheet" href="/fireline.css">
</head>
<body>
  <div class="home">
    <div class="brand"><img src="/logo.svg" alt=""><h1>Fire<span>Line</span></h1></div>
    <form class="search-form" action="/search" method="get" role="search">
      <input name="q" type="search" placeholder="Search your offline websites" autofocus autocomplete="off" aria-label="Search">
      <button type="submit">Search</button>
    </form>
    <p class="tagline">Everything here lives on your own disks. Nothing goes to the internet.</p>
    <div class="sites" id="sites"></div>
  </div>
  <script src="/fireline.js"></script>
</body>
</html>
